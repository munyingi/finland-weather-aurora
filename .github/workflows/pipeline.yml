name: Pipeline

# Every 3 hours: pull live FMI weather, NOAA space weather and Open-Meteo cloud
# cover, rebuild the dbt models, and publish dashboard files to the `data` branch.
on:
  schedule:
    - cron: "23 */3 * * *"
  workflow_dispatch:
    inputs:
      backfill_hours:
        description: Hours of FMI history to load when the warehouse is empty (max 168)
        default: "72"

permissions:
  contents: write   # push the data branch
  actions: write    # prune old warehouse caches

concurrency:
  group: pipeline
  cancel-in-progress: false

env:
  FWA_WAREHOUSE: data/warehouse.duckdb
  FWA_PUBLISH_DIR: data/published
  DBT_SEND_ANONYMOUS_USAGE_STATS: "False"

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # The DuckDB warehouse persists between runs in the Actions cache. If the
      # cache is ever evicted, the next run simply backfills from the APIs.
      - name: Restore warehouse
        uses: actions/cache/restore@v4
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}
          restore-keys: warehouse-

      - name: Ingest
        run: python -m ingest run --backfill-hours "${{ inputs.backfill_hours || '72' }}"

      - name: Source freshness
        continue-on-error: true
        run: dbt source freshness --project-dir transform --profiles-dir transform

      - name: dbt build (models, snapshot, tests)
        run: dbt build --project-dir transform --profiles-dir transform

      - name: Export dashboard files
        run: python -m ingest publish

      - name: Save warehouse
        if: always() && hashFiles('data/warehouse.duckdb') != ''
        uses: actions/cache/save@v4
        with:
          path: data/warehouse.duckdb
          key: warehouse-${{ github.run_id }}

      - name: Prune old warehouse caches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --key warehouse- --sort created_at --order desc --limit 100 --json id --jq '.[2:][].id' \
            | xargs -r -n1 gh cache delete || true

      # GitHub pauses scheduled workflows after 60 days without repo activity.
      # Re-enabling the workflow through the API resets that timer, so do it weekly.
      - name: Keep the schedule alive
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date -u +%u)" = "1" ] && [ "$(date -u +%H)" -lt "3" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/pipeline.yml/enable" && echo "Schedule refreshed"
          fi

      # Force-push a single-commit `data` branch so the history never grows.
      - name: Publish to data branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd data/published
          cat > README.md <<MD
          Generated by the Pipeline workflow on $(date -u +"%Y-%m-%d %H:%M UTC"). Do not edit; this branch is overwritten every run.
          MD
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Data refresh $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
