name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Unit tests (parsers, grid, idempotency, failure handling)
        run: pytest -q

      - name: End-to-end on demo data (ingest -> dbt build incl. unit tests -> publish)
        run: make demo

      - uses: actions/upload-artifact@v4
        with:
          name: published-demo
          path: data/published-demo/
          retention-days: 7
