version: 2

models:
  - name: stg_fmi__observations
    description: FMI observations joined to the parameter seed, with a physical-range validity flag.
    columns:
      - name: measure
        data_tests: [not_null]
      - name: observed_at
        data_tests: [not_null]
  - name: stg_fmi__stations
    columns:
      - name: fmisid
        data_tests: [unique, not_null]
  - name: stg_swpc__kp
    columns:
      - name: kp
        data_tests:
          - accepted_range:
              arguments: {min_value: 0, max_value: 9}
  - name: stg_swpc__solar_wind
    columns:
      - name: observed_at
        data_tests: [unique, not_null]
  - name: stg_openmeteo__cloud
    columns:
      - name: cloud_cover_pct
        data_tests:
          - not_null
          - accepted_range:
              arguments: {min_value: 0, max_value: 100}
  - name: stg_grid__cells
    columns:
      - name: cell_id
        data_tests: [unique, not_null]
      - name: h3_res
        data_tests:
          - accepted_values:
              arguments:
                values: [4, 5]
      - name: lat
        data_tests:
          - accepted_range:
              arguments: {min_value: 59.0, max_value: 70.5}
