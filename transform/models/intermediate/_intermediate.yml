version: 2

models:
  - name: int_stations
    description: Observing positions with current station metadata and region.
    columns:
      - name: station_key
        data_tests: [unique, not_null]
      - name: region_code
        data_tests: [not_null]
  - name: int_cell_station_pairs
    description: Weather cells and the stations within idw_max_km.
    data_tests:
      - unique_combination:
          arguments:
            columns: [cell_id, station_key]
  - name: int_space_weather_hourly
    columns:
      - name: hour_at
        data_tests: [unique, not_null]
      - name: kp
        data_tests: [not_null]
